server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;

    # Static assets (Quasar/webpack fingerprints its filenames, so these are
    # safe to cache aggressively).
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpe?g|gif|ico)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public";
    }

    # This app uses hash-mode routing (quasar.config.js vueRouterMode:
    # "hash"), so client-side routes never hit the server — but keep an
    # index.html fallback anyway in case that ever changes to history mode.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
